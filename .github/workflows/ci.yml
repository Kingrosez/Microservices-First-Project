name: Order Service CI

on:
   push:
      branches: ["main"]
   pull_request:
      branches: ["main"]
jobs:
   build:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Set up Java 17
           uses: actions/setup-java@v4
           with:
              distribution: 'temurin'
              java-version: '17'
              cache: 'maven'

         - name: build and test
           run: mvn clean verify
           working-directory: order-service

         - name: Upload JaCoCo Report
           uses: actions/upload-artifact@v4
           with:
              name: jacoco-report
              path: order-service/target/site/jacoco

         - name: Extract project version
           run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f order-service/pom.xml)" >> $GITHUB_ENV

         - name: Login to Docker Hub
           uses: docker/login-action@v3
           with:
             username: ${{ secrets.DOCKER_USERNAME}}
             password: ${{ secrets.DOCKER_PASSWORD}}

         - name: Build Docker Image
           run: |
             docker build \
               -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest \
               -t ${{ secrets.DOCKER_USERNAME }}/order-service:${{ env.VERSION }} \
               -t ${{ secrets.DOCKER_USERNAME }}/order-service:${{ github.sha }} \
               .
           working-directory: order-service

         - name: Push Docker Image
           run: |
             docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest
             docker push ${{ secrets.DOCKER_USERNAME }}/order-service:${{ env.VERSION }}
             docker push ${{ secrets.DOCKER_USERNAME }}/order-service:${{ github.sha }}